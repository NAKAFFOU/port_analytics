[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "port-analytics-multisource"
version = "3.0.0"
description = "Port analytics prototype using pre-allocated Oracle analytical views"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<3.0",
  "plotly>=5.22,<7.0",
  "streamlit>=1.35,<2.0",
  "python-dotenv>=1.0,<2.0",
  "PyYAML>=6.0,<7.0",
  "oracledb>=2.2,<4.0",
  "requests>=2.31,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
